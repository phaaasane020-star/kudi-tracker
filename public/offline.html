<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Offline · Kudi Tracker</title>
<style>
  :root { color-scheme: light; }
  body { margin: 0; min-height: 100dvh; display: flex; align-items: center; justify-content: center; background: #fff; color: #3f292b;
         font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; padding: 24px; box-sizing: border-box; }
  .box { max-width: 360px; }
  .mark { width: 56px; height: 56px; border-radius: 16px; background: #ef4444; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: 700; }
  h1 { font-size: 26px; margin: 24px 0 8px; letter-spacing: -0.02em; }
  p { color: #85706f; font-size: 16px; line-height: 1.55; margin: 0 0 20px; }
  button { background: #ef4444; color: #fff; border: 0; border-radius: 12px; padding: 14px 20px; font-size: 16px; font-weight: 600; width: 100%; }
</style>
</head>
<body>
  <div class="box">
    <div class="mark">₵</div>
    <h1>You're offline</h1>
    <p>This page hasn't been saved on your phone yet. Pages you've opened before still work without data. Connect to the internet to open this one.</p>
    <button onclick="history.length > 1 ? history.back() : location.assign('/')">Go back</button>
  </div>
</body>
</html>
